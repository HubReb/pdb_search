# Alembic configuration for paper_sorts
# The database URL is injected at runtime from paper_sorts.config.Settings.

[alembic]
# Path to migration scripts
script_location = migrations

# Template for new revision files
file_template = %%(rev)s_%%(slug)s

# Timezone for auto-generated timestamps
timezone = UTC

# Max length for revision slugs
truncate_slug_length = 40

# Logging
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
