# alembic.ini — Alembic configuration for paper_sorts migrations
# The database URL is read from the PDBSEARCH_DATABASE_URL environment variable
# or can be overridden with --database-url when running `pdbsearch migrate`.

[alembic]
script_location = migrations
prepend_sys_path = .
version_path_separator = os

# Connection URL is configured programmatically in migrations/env.py
# using PDBSEARCH_DATABASE_URL or the Settings object.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
