[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "paper-sorts"
version = "0.2.0"
description = "Off-line paper-database searcher: CLI for storing and searching publication metadata"
authors = [{ name = "HubReb" }]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "typer>=0.12",
    "pydantic-settings>=2.0",
    "psycopg[binary]>=3.1",
    "pybtex>=0.24",
    "pylatexenc>=2.10",
    "cryptography>=41.0",
    "rich>=13.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.4",
    "mypy>=1.10",
    "pytest>=8.0",
    "pytest-postgresql>=6.0",
    "pytest-cov>=5.0",
    "types-psycopg2",
]

[project.scripts]
pdbsearch = "paper_sorts.cli.app:app"

[tool.hatch.build.targets.wheel]
packages = ["src/paper_sorts"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "RUF"]
ignore = [
    "E501",
    "B008",    # typer.Option() in function defaults is the canonical Typer pattern
    "SIM117",  # nested with (pytest.raises + with_session) cannot be merged safely
]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
packages = ["paper_sorts"]

[[tool.mypy.overrides]]
module = ["pybtex.*", "pylatexenc.*", "pytest_postgresql.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=src/paper_sorts --cov-report=term-missing -v"
markers = [
    "benchmark: marks tests as performance benchmarks (deselect with -m 'not benchmark')",
]


[tool.coverage.run]
source = ["src/paper_sorts"]
branch = true

[tool.coverage.report]
show_missing = true
fail_under = 80
