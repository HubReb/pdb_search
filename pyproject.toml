[project]
name = "paper-sorts"
version = "0.1.0"
description = "Offline personal paper-database searcher CLI"
authors = [{ name = "HubReb", email = "hubert.rebekka@mailbox.org" }]
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

dependencies = [
    "sqlalchemy[mypy]>=2.0",
    "psycopg[binary]>=3.1",
    "alembic>=1.13",
    "typer>=0.12",
    "pydantic-settings>=2.0",
    "pybtex>=0.24",
    "pylatexenc>=2.10",
    "cryptography>=41.0",
    "rich>=13.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.4",
    "mypy>=1.10",
    "pytest>=8.0",
    "pytest-postgresql>=6.0",
    "coverage[toml]>=7.0",
]

[project.scripts]
pdbsearch = "paper_sorts.cli.app:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/paper_sorts"]

[tool.ruff]
target-version = "py311"
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "ANN", "B", "SIM"]
ignore = ["ANN101", "ANN102"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_ignores = true
plugins = ["sqlalchemy.ext.mypy.plugin"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"

[tool.coverage.run]
source = ["src/paper_sorts"]
omit = ["*/__init__.py"]

[tool.coverage.report]
show_missing = true
skip_covered = false
