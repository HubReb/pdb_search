[project]
name = "paper-sorts"
version = "0.1.0"
description = "Off-line paper-database searcher: a personal CLI for storing and searching publication metadata in a local PostgreSQL database."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "HubReb" }]
license = { file = "LICENSE" }
dependencies = [
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "typer>=0.12",
    "rich>=13.7",
    "pydantic-settings>=2.14.2",
    "psycopg[binary]>=3.1",
    "pybtex>=0.24",
    "pylatexenc>=2.10",
    "cryptography>=42.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-postgresql>=6.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
]

[project.scripts]
pdbsearch = "paper_sorts.cli.app:main"

[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/paper_sorts"]

[tool.uv]
# uv resolves and locks dev deps when invoked with --all-extras or --extra dev.
# uv.lock is committed for reproducibility.

[tool.ruff]
line-length = 100
src = ["src", "tests"]
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # Pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "UP",   # pyupgrade
    "D",    # pydocstyle (constitution Principle I requires docstrings)
    "ANN",  # flake8-annotations (constitution Principle I requires type hints)
    "S",    # flake8-bandit (security)
    "SIM",  # flake8-simplify
    "RUF",  # ruff-specific
]
ignore = [
    "D203",  # incompatible with D211
    "D213",  # incompatible with D212
    "ANN401",  # allow `Any` where pragmatic
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D", "ANN", "S101"]  # tests don't need pydocstyle/annotations and may use assert
"migrations/**" = ["D", "ANN"]      # alembic-generated stubs

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src/paper_sorts"]
plugins = ["sqlalchemy.ext.mypy.plugin"]

[[tool.mypy.overrides]]
module = ["pybtex.*", "pylatexenc.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "integration: integration tests requiring an ephemeral PostgreSQL via pytest-postgresql",
    "benchmark: baseline timing benchmarks (SC-006)",
]
