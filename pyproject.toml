[project]
name = "paper-sorts"
version = "0.1.0"
description = "Offline paper-database searcher: CLI for storing and searching publication metadata"
authors = [{ name = "HubReb", email = "17859526+HubReb@users.noreply.github.com" }]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "sqlalchemy[asyncio]>=2.0",
    "psycopg[binary]>=3.1",
    "typer[all]>=0.9",
    "pydantic-settings>=2.0",
    "alembic>=1.13",
    "pybtex>=0.24",
    "pylatexenc>=2.10",
    "cryptography>=41.0",
    "rich>=13.0",
]

[project.scripts]
pdbsearch = "paper_sorts.cli.app:app"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-postgresql>=6.0",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "mypy>=1.10",
    "pytest-benchmark>=4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/paper_sorts"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--tb=short"

[tool.coverage.run]
source = ["src/paper_sorts"]
branch = true

[tool.coverage.report]
fail_under = 80
show_missing = true
