[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "paper-sorts"
version = "0.1.0"
description = "Off-line paper-database searcher: a CLI for storing and searching publication metadata"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "HubReb", email = "17859526+HubReb@users.noreply.github.com" }]
dependencies = [
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.1",
    "typer>=0.12",
    "rich>=13.0",
    "alembic>=1.13",
    "pydantic-settings>=2.0",
    "pybtex>=0.24",
    "pylatexenc>=2.10",
    "cryptography>=41.0",
]

[project.scripts]
pdbsearch = "paper_sorts.cli.app:main"

[tool.hatch.build.targets.wheel]
packages = ["src/paper_sorts"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-postgresql>=6.0",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "mypy>=1.10",
    "types-psycopg2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
pythonpath = ["src"]
markers = [
    "benchmark: performance baseline benchmarks (run with pytest -m benchmark)",
]

[tool.ruff]
src = ["src"]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src/paper_sorts"]
[[tool.mypy.overrides]]
module = ["pybtex.*", "pylatexenc.*"]
ignore_missing_imports = true
