[project]
name = "paper-sorts"
version = "0.1.0"
description = "Off-line paper-database searcher CLI"
authors = [{ name = "HubReb" }]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "typer>=0.12",
    "pydantic-settings>=2.0",
    "psycopg[binary]>=3.1",
    "pybtex>=0.24",
    "pylatexenc>=2.10",
    "rich>=13",
    "cryptography>=41",
]

[project.scripts]
pdbsearch = "paper_sorts.cli.app:app"

[project.optional-dependencies]
dev = [
    "ruff>=0.4",
    "mypy>=1.10",
    "pytest>=8.0",
    "pytest-postgresql>=6.0",
    "coverage>=7.0",
    "pytest-cov>=5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/paper_sorts"]

[tool.ruff]
src = ["src"]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "PT"]
ignore = ["B008"]

[tool.mypy]
strict = true
python_version = "3.11"
mypy_path = "src"
packages = ["paper_sorts"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"

[tool.coverage.run]
source = ["src/paper_sorts"]
branch = true
