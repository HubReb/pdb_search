[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "paper-sorts"
version = "0.2.0"
description = "Off-line paper-database searcher: CLI to store and search publication metadata in PostgreSQL"
authors = [{ name = "HubReb" }]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "sqlalchemy[asyncio]>=2.0",
    "alembic>=1.13",
    "typer>=0.12",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "psycopg[binary]>=3.1",
    "pybtex>=0.24",
    "pylatexenc>=2.10",
    "cryptography>=41.0",
    "rich>=13.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-postgresql>=6.0",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "mypy>=1.10",
    "types-psycopg2",
]

[project.scripts]
pdbsearch = "paper_sorts.cli.app:app"

[tool.hatch.build.targets.wheel]
packages = ["src/paper_sorts"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "PTH", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# Typer requires typer.Option() in function defaults — B008 is a false positive for CLI code
"src/paper_sorts/cli/*.py" = ["B008"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
packages = ["paper_sorts"]

[[tool.mypy.overrides]]
module = ["pybtex.*", "pylatexenc.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--tb=short"

[tool.coverage.run]
source = ["src/paper_sorts"]
omit = ["*/migrations/*"]
