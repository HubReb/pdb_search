[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "paper-sorts"
version = "0.1.0"
description = "Off-line paper-database searcher CLI"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "HubReb" }]
dependencies = [
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.1",
    "alembic>=1.13",
    "pydantic-settings>=2.0",
    "typer>=0.12",
    "rich>=13.0",
    "pybtex>=0.24",
    "pylatexenc>=2.10",
    "cryptography>=41.0",
]

[project.scripts]
pdbsearch = "paper_sorts.cli.app:main"

[project.optional-dependencies]
dev = [
    "ruff>=0.4",
    "mypy>=1.10",
    "pytest>=8.0",
    "pytest-postgresql>=6.0",
    "pytest-cov>=5.0",
    "pytest-benchmark>=4.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/paper_sorts"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "C4"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]
# Typer requires typer.Option() in function argument defaults (it's a framework pattern)
"src/paper_sorts/cli/*.py" = ["B008"]

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
packages = ["paper_sorts"]

[[tool.mypy.overrides]]
module = "paper_sorts.*"
strict = true
disallow_untyped_defs = true
disallow_any_generics = true
warn_return_any = true

[[tool.mypy.overrides]]
module = ["pybtex.*", "pylatexenc.*", "pytest_postgresql.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v"
log_cli = true
log_cli_level = "WARNING"

[tool.coverage.run]
source = ["src/paper_sorts"]
omit = ["tests/*"]

[tool.coverage.report]
show_missing = true
