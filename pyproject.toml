[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "paper-sorts"
version = "0.2.0"
description = "Off-line paper-database searcher: a CLI to store and query publication metadata in a local PostgreSQL database."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "GPL-3.0-or-later" }
authors = [{ name = "HubReb" }]
dependencies = [
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.1",
    "alembic>=1.13",
    "typer>=0.12",
    "rich>=13.0",
    "pydantic-settings>=2.0",
    "cryptography>=41.0",
    "pybtex>=0.24",
    "pylatexenc>=2.10",
]

[project.scripts]
pdbsearch = "paper_sorts.cli.app:app"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-postgresql>=6.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
]

[tool.hatch.build.targets.wheel]
packages = ["src/paper_sorts"]

[tool.ruff]
src = ["src", "tests"]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["pybtex.*", "pylatexenc.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
