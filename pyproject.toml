[project]
name = "paper-sorts"
version = "1.0.0"
description = "Offline paper-database searcher: a CLI over a local PostgreSQL store of publication metadata."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "HubReb" }]
dependencies = [
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "typer>=0.12",
    "rich>=13.7",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "psycopg[binary]>=3.1",
    "cryptography>=42.0",
    "pybtex>=0.24",
    "pylatexenc>=2.10",
]

[project.scripts]
pdbsearch = "paper_sorts.cli.app:app"

[project.optional-dependencies]
dev = [
    "pytest>=8.1",
    "pytest-postgresql>=6.0",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "mypy>=1.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/paper_sorts"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]

[[tool.mypy.overrides]]
module = ["pybtex.*", "pylatexenc.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["src/paper_sorts"]
