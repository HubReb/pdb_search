[project]
name = "paper-sorts"
version = "0.1.0"
description = "Off-line paper-database searcher: CLI for storing and searching publication metadata in PostgreSQL"
authors = [{ name = "HubReb", email = "17859526+HubReb@users.noreply.github.com" }]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.1",
    "typer>=0.12",
    "alembic>=1.13",
    "pydantic-settings>=2.0",
    "pydantic>=2.0",
    "pybtex>=0.24",
    "pylatexenc>=2.10",
    "cryptography>=41.0",
    "rich>=13.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-postgresql>=6.0",
    "pytest-cov>=5.0",
    "mypy>=1.10",
    "ruff>=0.4",
]

[project.scripts]
pdbsearch = "paper_sorts.cli.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/paper_sorts"]

[tool.ruff]
src = ["src"]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = []

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
mypy_path = "src"
packages = ["paper_sorts"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-v"
python_files = ["test_*.py", "bench_*.py"]

[tool.coverage.run]
source = ["paper_sorts"]
branch = true

[tool.coverage.report]
show_missing = true
