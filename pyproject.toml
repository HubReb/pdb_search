[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "paper-sorts"
version = "0.1.0"
description = "Off-line paper-database searcher: CLI to manage publication metadata in PostgreSQL"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "HubReb" }]
dependencies = [
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.1",
    "alembic>=1.13",
    "pydantic-settings>=2.0",
    "typer>=0.12",
    "rich>=13.0",
    "pybtex>=0.24",
    "pylatexenc>=2.10",
    "cryptography>=41.0",
]

[project.scripts]
pdbsearch = "paper_sorts.cli.app:run"

[project.optional-dependencies]
dev = [
    "ruff>=0.4",
    "mypy>=1.10",
    "pytest>=8.0",
    "pytest-postgresql>=6.0",
    "pytest-benchmark>=4.0",
    "pytest-cov>=5.0",
    "typer[testing]>=0.12",
]

[tool.hatch.build.targets.wheel]
packages = ["src/paper_sorts"]

[tool.ruff]
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "W", "B"]
ignore = ["E501"]

[tool.mypy]
strict = true
python_version = "3.11"
mypy_path = "src"
packages = ["paper_sorts"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--tb=short"

[tool.coverage.run]
source = ["src/paper_sorts"]
omit = ["*/migrations/*"]
